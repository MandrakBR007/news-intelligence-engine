name: Offline public tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public-package hygiene
        run: python -B tools/check_public_package.py
      - name: Run dependency-free offline tests
        run: python -B -m unittest discover -s tests -v
