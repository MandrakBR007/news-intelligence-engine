[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-intelligence-engine"
version = "2.0.0"
description = "Local-first open-source toolkit for public news research"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "News Intelligence Engine contributors" }]
keywords = ["news", "rss", "data-engineering", "research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=3.2.0,<4"]
dev = ["ruff>=0.8,<1", "mypy>=1.13,<2", "pytest>=8,<10", "pytest-cov>=6,<8"]
all = ["google-genai>=3.2.0,<4"]

[project.scripts]
news-engine = "news_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["news_engine*"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["news_engine"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
